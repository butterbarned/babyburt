<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Download Dusklight</title>
    <link rel="icon" type="image/png" href="/logo-square.png?v=firefly">
    <style>
      /* the look of the sign-up page: black and white, the game's text font,
         rounded pills. the rows are filled in by the server (lib/http.js),
         one for each installer it has. */
      @font-face { font-family: "DigitalDelivery"; font-weight: 400; src: url("/fonts/CCDigitalDelivery-Regular.otf") format("opentype"); }
      @font-face { font-family: "DigitalDelivery"; font-weight: 700; src: url("/fonts/CCDigitalDelivery-Bold.otf") format("opentype"); }
      :root {
        color-scheme: dark;
        --bg: #0b0a1f;
        --panel: #131335;
        --line: #2e2e5e;
        --text: #fbf6dd;
        --glow: #f6ec7c;
        --ink: #17142e;
        --muted: #9a9cc8;
      }
      * { box-sizing: border-box; }
      ::selection { background: var(--glow); color: var(--ink); }
      body {
        margin: 0;
        padding: 40px 16px;
        background: radial-gradient(1100px 600px at 50% -10%, #2b2168 0%, transparent 62%), var(--bg);
        background-attachment: fixed;
        color: var(--text);
        font: 15px/1.4 "DigitalDelivery", system-ui, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-underline-offset: 3px; }
      main {
        max-width: 520px;
        margin: 0 auto;
        padding: 24px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      .logo { display: block; height: 72px; margin: 0 0 12px; }
      h1 { margin: 0 0 14px; font-size: 26px; font-weight: 700; letter-spacing: 0.01em; }
      .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
      .row div { flex: 1; min-width: 0; }
      .system { font-weight: 700; }
      .detail { color: var(--muted); font-size: 12px; }
      .get {
        flex: none;
        padding: 7px 16px 8px;
        border: 1px solid var(--glow);
        border-radius: 999px;
        background: var(--glow);
        color: var(--ink);
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
        transition: background 0.12s, border-color 0.12s;
      }
      .get:hover { background: #fff6a6; border-color: #fff6a6; box-shadow: 0 0 22px rgba(246, 236, 124, 0.45); }
      .soon { flex: none; padding: 7px 16px 8px; border: 1px dashed var(--line); border-radius: 999px; color: var(--muted); font-size: 14px; }
      .none { margin: 0; padding: 12px 0; border-top: 1px solid var(--line); color: var(--muted); }
      footer { max-width: 520px; margin: 14px auto 0; text-align: center; font-size: 13px; color: var(--muted); }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <main>
      <a href="/"><img class="logo" src="/logo.png?v=firefly" alt="Dusklight"></a>
      <h1>Download</h1>
      {{rows}}
    </main>
    <footer><a href="/register">Create an account</a> · {{sums}}</footer>
    <footer>Dusklight is an unofficial fan project, not affiliated with WildWorks or Animal Jam. <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></footer>
  </body>
</html>
